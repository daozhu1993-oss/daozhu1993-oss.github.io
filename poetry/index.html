    const elPage=document.getElementById('page');
    const elMasthead=document.getElementById('masthead');
    const elTitle=document.getElementById('title');
    const elDatePill=document.getElementById('datePill');
    const elTopicPill=document.getElementById('topicPill');
    const elNumPill=document.getElementById('numPill');
    const elText=document.getElementById('text');
    const elGold=document.getElementById('gold');
    const elBigNum=document.getElementById('bigNum');
    const elCount=document.getElementById('count');
    const elProgress=document.getElementById('progress');
    let cur=0;
    function pad(n){ return String(n).padStart(2,'0'); }
    function tagFor(p){
      if (/一一|孩子|女儿|父亲|妈妈|你出生|抱/.test(p.body)) return '给女儿';
      if (/爱|爱情|你/.test(p.title)) return '给爱人';
      return '日常';
    }
    function splitBody(body){ return body.split(/\n\n+/).map(s=>s.trim()).filter(Boolean); }
    function render(i){
      const p=poems[i];
      elPage.classList.add('fade');
      setTimeout(()=>{
        elMasthead.innerHTML='<span class="masthead-label">岛主的诗</span><span class="masthead-dot">·</span><span class="pill category-pill">'+tagFor(p)+'</span>';
        elTitle.textContent=p.title;
        elDatePill.textContent=p.date||'——';
        elTopicPill.textContent=p.topic||'日常';
        elNumPill.textContent=pad(i+1)+' / '+pad(poems.length);
        elBigNum.textContent=pad(i+1);
        elGold.textContent=p.gold||'';
        elText.innerHTML=splitBody(p.body).map(s=>'<p>'+s.replace(/\n/g,'<br>')+'</p>').join('');
        elCount.textContent=pad(i+1)+' / '+pad(poems.length);
        elProgress.style.width=((i+1)/poems.length*100)+'%';
        const onItem=elTocList.querySelector('.toc-item.on'); if(onItem) onItem.classList.remove('on');
        const curItem=elTocList.querySelector('.toc-item[data-index="'+i+'"]');
        if(curItem){ curItem.classList.add('on'); curItem.scrollIntoView({block:'nearest'}); }
        elPage.classList.remove('fade');
      },210);
    }
    function go(d){ cur=(cur+d+poems.length)%poems.length; render(cur); }
    document.getElementById('prev').addEventListener('click',()=>go(-1));
    document.getElementById('next').addEventListener('click',()=>go(1));
    document.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft') go(-1); else if(e.key==='ArrowRight') go(1); });
    let sx=0;
    document.addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; },{passive:true});
    document.addEventListener('touchend',e=>{ const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>40) go(dx<0?1:-1); });
    const elTocList=document.getElementById('tocList');
    const elTocSearch=document.getElementById('tocSearch');
    const elTocPanel=document.getElementById('tocPanel');
    const elTocOverlay=document.getElementById('tocOverlay');
    const elTocBtn=document.getElementById('tocBtn');
    const elTocClose=document.getElementById('tocClose');
    function buildToc(filter){
      const q=(filter||'').trim().toLowerCase(); elTocList.innerHTML='';
      poems.forEach((p,i)=>{
        if(q && !p.title.toLowerCase().includes(q)) return;
        const item=document.createElement('button');
        item.className='toc-item'+(i===cur?' on':'');
        item.textContent=pad(i+1)+' / '+p.title;
        item.dataset.index=i;
        item.addEventListener('click',()=>{ closeToc(); cur=i; render(cur); });
        elTocList.appendChild(item);
      });
    }
    function openToc(){ buildToc(elTocSearch.value); elTocPanel.classList.add('open'); elTocOverlay.classList.add('show'); elTocPanel.setAttribute('aria-hidden','false'); elTocSearch.focus(); }
    function closeToc(){ elTocPanel.classList.remove('open'); elTocOverlay.classList.remove('show'); elTocPanel.setAttribute('aria-hidden','true'); }
    elTocBtn.addEventListener('click',openToc);
    elTocClose.addEventListener('click',closeToc);
    elTocOverlay.addEventListener('click',closeToc);
    elTocSearch.addEventListener('input',()=>buildToc(elTocSearch.value));
    document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeToc(); });
    render(0);

  </script>
