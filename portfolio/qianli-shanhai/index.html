<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>千里江山 · 借笔还魂</title>
  <meta name="description" content="北宋政和三年，十八岁王希孟借笔还魂。漫步三维青绿山河，唤醒山海六方神兽。">
  <meta name="theme-color" content="#EFE4CD">
  <link rel="stylesheet" href="./src/style.css">

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.min.js",
      "three/addons/utils/BufferGeometryUtils.js": "./vendor/BufferGeometryUtils.js"
    }
  }
  </script>

  <script>
    // 全局错误守卫
    window.addEventListener('error', function(e) {
      console.error('[Global Error]', e);
      var errEl = document.getElementById('err-fallback');
      if (errEl) {
        errEl.style.display = 'grid';
        errEl.innerHTML = '<div style="background:#FDF9EE;padding:24px 32px;border:2px solid #876D46;border-radius:12px;max-width:500px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,0.15);">' +
          '<h3 style="color:#A8261C;margin-bottom:12px;font-size:18px;">画境遇阻</h3>' +
          '<p style="font-size:13px;color:#555;line-height:1.6;margin-bottom:16px;">' + (e.message || '脚本解析异常') + '</p>' +
          '<button onclick="location.reload()" style="padding:8px 24px;border-radius:999px;background:#A8261C;color:#fff;border:none;cursor:pointer;font-weight:600;">重新入画</button>' +
          '</div>';
      }
    });
  </script>
</head>
<body>
  <div id="app">
    <!-- 3D 青绿大境漫步视口 (主视口，直接呈现) -->
    <div id="viewport-3d"></div>

    <!-- UI 交互层 -->
    <div id="ui-layer"></div>
  </div>

  <div id="err-fallback" style="display:none;position:fixed;inset:0;place-items:center;z-index:99999;background:rgba(239,228,205,0.92);"></div>

  <script type="module">
    import { BEASTS } from './src/beasts.js';
    import { audio } from './src/audio.js';
    import { World3D } from './src/world3d.js';
    import { ScrollViewer } from './src/scroll.js';
    import { UIManager } from './src/ui.js';

    window.addEventListener('DOMContentLoaded', () => {
      const world3DViewport = document.getElementById('viewport-3d');
      const uiLayer = document.getElementById('ui-layer');

      let world3D = null;
      let scrollViewer = null;
      let ui = null;

      // 1. 初始化 3D 青绿世界引擎 (主舞台，对标梵高星空 3D 漫步)
      world3D = new World3D(world3DViewport, {
        onAwakenBeast: (beastData) => {
          if (scrollViewer) scrollViewer.setAwakened(beastData.id);
          if (ui) ui.showBeastAwakened(beastData);
        },
        onNearBeastChange: (beast, dist) => {
          if (ui) ui.setNearBeast(beast, dist);
        },
        onCompassUpdate: (compassList, yaw) => {
          if (ui) ui.updateCompass(compassList, yaw);
        },
        onExitToScroll: () => {
          if (ui) ui.toggleScrollDrawer(true);
        }
      });

      // 2. 初始化 UI 管理器
      ui = new UIManager(uiLayer, {
        onAwakenAction: () => {
          if (world3D) world3D.tryAwakenNearBeast();
        },
        onTeleport: (beastId) => {
          if (world3D) world3D.teleportToBeast(beastId);
        },
        onToggleScroll: (open) => {
          if (open && scrollViewer) {
            setTimeout(() => scrollViewer.resize(), 50);
          }
        },
        onVirtualMove: (vec) => {
          if (world3D) {
            world3D.keys['KeyW'] = vec.y < -0.3;
            world3D.keys['KeyS'] = vec.y > 0.3;
            world3D.keys['KeyA'] = vec.x < -0.3;
            world3D.keys['KeyD'] = vec.x > 0.3;
          }
        }
      });

      // 3. 将真实 12 米画卷挂载至抽屉容器内 (随时按 M 或点击按钮展开)
      const drawerContainer = document.getElementById('drawer-canvas-container');
      if (drawerContainer) {
        scrollViewer = new ScrollViewer(drawerContainer, {
          onSelectBeast: (beast) => {
            if (world3D) world3D.teleportToBeast(beast.id);
            if (ui) ui.toggleScrollDrawer(false);
          }
        });
      }

      // 首次用户交互触发音频就绪
      document.body.addEventListener('click', () => {
        audio.ensureContext();
      }, { once: true });
    });
  </script>
</body>
</html>
