<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>千里江山 · 山海入画</title>
  <meta name="description" content="游目十二米北宋青绿长卷，推门步入山河胜境，唤醒沉睡于千峰翠微间的六方山海神兽。">
  <meta name="theme-color" content="#EFE4CD">
  <link rel="stylesheet" href="./src/style.css">

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.min.js",
      "three/addons/utils/BufferGeometryUtils.js": "./vendor/BufferGeometryUtils.js"
    }
  }
  </script>

  <script>
    // 全局错误守卫：若遇异常立即在页面显著提示，绝不出现空白静默
    window.addEventListener('error', function(e) {
      console.error('[Global Error]', e);
      var errEl = document.getElementById('err-fallback');
      if (errEl) {
        errEl.style.display = 'grid';
        errEl.innerHTML = '<div style="background:#FDF9EE;padding:24px 32px;border:2px solid #876D46;border-radius:12px;max-width:500px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,0.15);">' +
          '<h3 style="color:#A8261C;margin-bottom:12px;font-size:18px;">画卷展卷遇阻</h3>' +
          '<p style="font-size:13px;color:#555;line-height:1.6;margin-bottom:16px;">' + (e.message || '脚本解析异常') + '</p>' +
          '<button onclick="location.reload()" style="padding:8px 24px;border-radius:999px;background:#A8261C;color:#fff;border:none;cursor:pointer;font-weight:600;">重新展卷</button>' +
          '</div>';
      }
    });
  </script>
</head>
<body>
  <div id="app">
    <!-- 长卷游目视口 (Layer 1) -->
    <div id="viewport-scroll"></div>

    <!-- 3D 画中漫步视口 (Layer 2) -->
    <div id="viewport-3d"></div>

    <!-- UI 交互层 (Layer 3) -->
    <div id="ui-layer"></div>
  </div>

  <div id="err-fallback" style="display:none;position:fixed;inset:0;place-items:center;z-index:99999;background:rgba(239,228,205,0.92);"></div>

  <script type="module">
    import { BEASTS } from './src/beasts.js';
    import { audio } from './src/audio.js';
    import { ScrollViewer } from './src/scroll.js';
    import { World3D } from './src/world3d.js';
    import { UIManager } from './src/ui.js';

    window.addEventListener('DOMContentLoaded', () => {
      const scrollViewport = document.getElementById('viewport-scroll');
      const world3DViewport = document.getElementById('viewport-3d');
      const uiLayer = document.getElementById('ui-layer');

      let currentActiveBeastId = 'fuzhu';
      let world3D = null;
      let ui = null;

      function ensureWorld3D() {
        if (!world3D) {
          world3D = new World3D(world3DViewport, {
            onAwakenBeast: (beastData) => {
              scrollViewer.setAwakened(beastData.id);
              if (ui) ui.showBeastAwakened(beastData);
            },
            onExitToScroll: () => {
              switchToScrollMode();
            }
          });
        }
        return world3D;
      }

      // 1. 优先极速启动长卷游目引擎 (0 阻塞毫秒级展现)
      const scrollViewer = new ScrollViewer(scrollViewport, {
        onEnter3D: (beastId) => {
          switchTo3DMode(beastId);
        },
        onSelectBeast: (beast) => {
          scrollViewer.setAwakened(beast.id);
          if (ui) ui.showBeastAwakened(beast);
        },
        onProgressChange: (progress) => {
          if (ui) ui.updateScrollThumb(progress);
        }
      });

      // 2. 初始化 UI 管理器并挂载至独立 UI 层
      ui = new UIManager(uiLayer, {
        onModeChange: (targetMode) => {
          if (targetMode === 'scroll') {
            switchToScrollMode();
          } else {
            switchTo3DMode(currentActiveBeastId);
          }
        },
        onZoom: (delta) => {
          scrollViewer.zoomBy(delta);
        },
        onEnter3DFromModal: (beastId) => {
          switchTo3DMode(beastId);
        },
        onJumpSection: (progress, beastId) => {
          scrollViewer.scrollToProgress(progress, true);
        },
        onAwakenAction: () => {
          if (world3D) world3D.tryAwakenNearBeast();
        }
      });

      // 空闲时静默预热 3D 渲染器，不占用初次开卷主线程
      if ('requestIdleCallback' in window) {
        requestIdleCallback(() => ensureWorld3D(), { timeout: 2500 });
      } else {
        setTimeout(() => ensureWorld3D(), 1200);
      }

      // 切换至 3D 画中世界
      function switchTo3DMode(beastId) {
        currentActiveBeastId = beastId;
        const beast = BEASTS.find(b => b.id === beastId) || BEASTS[0];

        scrollViewport.style.display = 'none';
        world3DViewport.style.display = 'block';

        const w3d = ensureWorld3D();
        w3d.enterBeastWorld(beast.id);
        ui.setMode('3d', `${beast.scenicSpot} · 寻访 ${beast.name}`);
        audio.playEnterPaintingSound();
      }

      // 切换回长卷游目
      function switchToScrollMode() {
        world3DViewport.style.display = 'none';
        scrollViewport.style.display = 'block';

        ui.setMode('scroll');
        audio.playReturnToScrollSound();

        const beast = BEASTS.find(b => b.id === currentActiveBeastId);
        if (beast) {
          scrollViewer.scrollToProgress(beast.scrollProgress, true);
        }
      }

      // 首次交互自动唤起古琴背景乐
      document.body.addEventListener('click', () => {
        audio.ensureContext();
      }, { once: true });
    });
  </script>
</body>
</html>
